# GPU: iGPU AMD primero, NVIDIA como secundaria
env = AQ_DRM_DEVICES,/dev/dri/gpu-igpu:/dev/dri/gpu-dgpu

env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland
env = QT_QPA_PLATFORM,wayland
env = GDK_BACKEND,wayland,x11
env = ELECTRON_OZONE_PLATFORM_HINT,auto
env = MOZ_ENABLE_WAYLAND,1



monitor = ,preferred,auto,1

$terminal = kitty
$fileManager = nautilus
$menu = ~/.config/rofi/launchers/type-2/launcher.sh

exec-once = systemctl --user start hyprpolkitagent
exec-once = awww-daemon
exec-once = sh -c 'for i in $(seq 1 25); do awww query >/dev/null 2>&1 && break; sleep 0.2; done; [ -f "$HOME/.cache/current_wallpaper" ] && awww img "$(cat "$HOME/.cache/current_wallpaper")"'
exec-once = sleep 0.5 && waybar
exec-once = swaync
exec-once = nm-applet --indicator
exec-once = blueman-applet
exec-once = wl-paste --watch cliphist store
exec-once = swayosd-server
exec-once = thunderbird

general {
  gaps_in = 5
  gaps_out = 10
  border_size = 2
  col.active_border = rgba(89b4faee) rgba(cba6f7ee) 45deg
  col.inactive_border = rgba(45475aaa)
  layout = dwindle

}

decoration {
  rounding = 10
  blur {
      enabled = true
      size = 6
      passes = 2
  }

}

windowrule = opacity 0.85 0.85, match:class ^(kitty)$
windowrule = workspace 3 silent, match:class ^(org\.mozilla\.Thunderbird)$

animations {
  enabled = true
  bezier = smooth, 0.05, 0.9, 0.1, 1.0
  animation = windows, 1, 5, smooth
  animation = fade, 1, 5, default
  animation = fadeIn, 1, 8, default
  animation = fadeLayersIn, 1, 8, default
  animation = workspaces, 1, 4, smooth, slide
}

input {
  kb_layout = latam
  follow_mouse = 1
  touchpad {
    natural_scroll = true
    disable_while_typing = true
  }
}

$mod = SUPER

bind = $mod, Q, exec, $terminal
bind = $mod, C, killactive
bind = $mod, M, exit
bind = $mod, E, exec, $fileManager
bind = $mod, V, togglefloating
bind = $mod, R, exec, $menu
bind = $mod, W, exec, ~/.local/bin/wallpaper.sh
bind = $mod, O, exec, ~/.local/bin/kitty-opacity.sh
bind = $mod, K, exec, ~/.local/bin/keybinds.sh
bind = $mod, F, fullscreen
bind = $mod, L, exec, hyprlock

bind = $mod, left, movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up, movefocus, u
bind = $mod, down, movefocus, d

bind = $mod SHIFT, left, movewindow, l
bind = $mod SHIFT, right, movewindow, r
bind = $mod SHIFT, up, movewindow, u
bind = $mod SHIFT, down, movewindow, d

binde = $mod CTRL, left, resizeactive, -40 0
binde = $mod CTRL, right, resizeactive, 40 0
binde = $mod CTRL, up, resizeactive, 0 -40
binde = $mod CTRL, down, resizeactive, 0 40

bind = $mod SHIFT, S, swapnext

bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
# silent: mueve la ventana pero no te sigue al workspace nuevo
bind = $mod SHIFT, 1, movetoworkspacesilent, 1
bind = $mod SHIFT, 2, movetoworkspacesilent, 2
bind = $mod SHIFT, 3, movetoworkspacesilent, 3
bind = $mod SHIFT, 4, movetoworkspacesilent, 4
bind = $mod SHIFT, 5, movetoworkspacesilent, 5
# no-silent: mueve la ventana Y te lleva con ella
bind = $mod ALT, 1, movetoworkspace, 1
bind = $mod ALT, 2, movetoworkspace, 2
bind = $mod ALT, 3, movetoworkspace, 3
bind = $mod ALT, 4, movetoworkspace, 4
bind = $mod ALT, 5, movetoworkspace, 5

bind = $mod, mouse_down, workspace, e+1
bind = $mod, mouse_up, workspace, e-1

# Tecla de captura real en este Legion (confirmado con wev): XF86SelectiveScreenshot, no Print
# Region al portapapeles + editor
bind = , XF86SelectiveScreenshot, exec, grim -g "$(slurp)" - | swappy -f -
# Pantalla completa al portapapeles
bind = SHIFT, XF86SelectiveScreenshot, exec, grim - | wl-copy
# Region directo a archivo con timestamp
bind = SUPER, XF86SelectiveScreenshot, exec, grim -g "$(slurp)" ~/Pictures/Screenshots/$(date +%Y%m%d_%H%M%S).png
# Ventana activa al portapapeles
bind = ALT, XF86SelectiveScreenshot, exec, grim -g "$(hyprctl activewindow -j | jq -r '"\(.at[0]),\(.at[1]) \(.size[0])x\(.size[1])"')" - | wl-copy

bindel = , XF86AudioRaiseVolume, exec, swayosd-client --output-volume raise
bindel = , XF86AudioLowerVolume, exec, swayosd-client --output-volume lower
bindel = , XF86AudioMute, exec, swayosd-client --output-volume mute-toggle
bindel = , XF86MonBrightnessUp, exec, swayosd-client --brightness raise
bindel = , XF86MonBrightnessDown, exec, swayosd-client --brightness lower

bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

dwindle {
  preserve_split = true

}

misc {
  disable_hyprland_logo = true
  force_default_wallpaper = 0

}

debug:disable_logs = false
