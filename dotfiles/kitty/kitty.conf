shell /usr/bin/zsh

# Remote control (necesario para kitty-opacity.sh vía `kitty @`)
allow_remote_control yes
listen_on unix:/tmp/kitty

# Fuente
# Nota: uso la variante "Mono" del Nerd Font (no la base "JetBrainsMono Nerd
# Font") a proposito: fuerza todos los glyphs/iconos a exactamente 1 celda de
# ancho, que es lo que necesita el prompt agnoster de zsh para que las flechas
# powerline no queden desalineadas en la grilla monoespaciada de kitty.
font_family      JetBrainsMono Nerd Font Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.0

# Opacidad + blur
# El blur real lo aplica Hyprland (decoration.blur, ya activado) al detectar
# el canal alpha de esta ventana; kitty solo necesita quedar translucido.
background_opacity 0.85
dynamic_background_opacity yes

# Teclas
# Ctrl+V pega. Ctrl+C queda intacto (sin remapear) para que siga mandando
# SIGINT como señal de interrupción normal de la shell.
map ctrl+v paste_from_clipboard

# Tema
include theme.conf
