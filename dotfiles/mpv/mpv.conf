# GPU hibrida: dibujar con OpenGL (usa la AMD, igual que Hyprland). Con Vulkan,
# mpv enumera todas las GPU y despierta la NVIDIA aunque no la use.
gpu-api=opengl
# Decodificacion por hardware en la AMD (HEVC/H.265 de los videos del iPhone)
hwdec=vaapi
# Cargar solo la interop de VA-API: por defecto (libmpv/Celluloid) precarga CUDA y despierta la NVIDIA
gpu-hwdec-interop=vaapi
